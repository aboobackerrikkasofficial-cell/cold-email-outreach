name: Daily Cold Outreach Bot

on:
  schedule:
    # Runs at 12:00 PM IST (which is 06:30 AM UTC)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the bot can save the updated CSVs back to GitHub

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Credentials and Tokens
      env:
        CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
        TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      run: |
        echo "$CREDENTIALS_JSON" > credentials.json
        echo "$TOKEN_JSON" > token.json

    - name: Run Outreach Bot
      env:
        GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
        SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
        GMAIL_CREDENTIALS_FILE: credentials.json
        GMAIL_TOKEN_FILE: token.json
      run: |
        python main.py

    - name: Commit and push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/
        # Only commit if there are changes to the CSV files
        git diff --quiet && git diff --staged --quiet || git commit -m "chore: update outreach data [skip ci]"
        git push
